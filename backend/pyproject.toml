[project]
name = "pellevista-content-autopilot-backend"
version = "0.1.0"
description = "Backend API for Pellevista Content Autopilot"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.29.0",
    "boto3>=1.43.42",
    "celery>=5.6.3",
    "fastapi>=0.115.0",
    "higgsfield-client>=0.1.0",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.9",
    "redis>=8.0.1",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
